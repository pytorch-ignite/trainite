model:
  _target_: "trainite.models.transformer.build_transformer_model"
  hidden_size: 64
  num_layers: 2
  num_heads: 2
  feedforward_dim: 128
  dropout: 0.1
  max_seq_len: 128

optimizer:
  _target_: "torch.optim.AdamW"
  lr: 0.001

dataset:
  _target_: "trainite.datasets.string_reverse.build_string_reverse_dataloaders"
  train_size: 256
  val_size: 64
  batch_size: 32
  min_seq_len: 4
  max_seq_len: 32
  fixed_length: false
  num_workers: 2
  seed: 7

trainer:
  epochs: 5
  learning_rate: 0.001
  log_every_steps: 10
  grad_clip_norm: 1.0

output:
  root: output
  run_name: string-reverse-experiment

seed: 42
device: cpu
