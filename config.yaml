model_name: "transformer"
dataset_name: "string-reverse"
trainer_name: "pretrainer"

model:
  _target_: "trainite.models.transformer.build_transformer_model"
  vocab_size: ${dataset.vocab_size}
  hidden_size: 64
  num_layers: 2
  num_heads: 2
  feedforward_dim: 128
  dropout: 0.1
  max_seq_len: 128
  
dataset:
  _target_: "trainite.datasets.string_reverse.build_string_reverse_dataloaders"
  alphabet: "@alpha"
  vocab_size: 26
  train_size: 256
  val_size: 64
  batch_size: 32
  min_seq_len: 4
  max_seq_len: 32
  fixed_length: false
  num_workers: 2
  seed: 7

trainer:  
  epochs: 5
  device: cpu
  learning_rate: 0.001
  log_every_steps: 10
  grad_clip_norm: 1.0

output:
  root: output
  run_name: string-reverse-experiment
  
seed: 42
