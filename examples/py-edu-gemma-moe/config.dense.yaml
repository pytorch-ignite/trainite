project_name: py-edu-gemma-moe
preprocessor:
  _target_: preprocessors.python_bpe.load_python_bpe_tokenizer
  vocab_size: 8192
  cache_dir: outputs/tokenizers
model:
  _target_: models.gemma4_dense.Gemma4DenseModel
  collate_fn_target: models.gemma4_dense.CausalLMCollateFn
  hidden_size: 256
  num_layers: 8
  num_attention_heads: 4
  num_key_value_heads: 2
  dense_intermediate_size: 1536
  head_dim: 64
  layer_types: null
  layer_pattern: sssg
  sliding_window: 512
  rope_theta: 10000.0
  global_rope_theta: 1000000.0
  rotary_fraction: 1.0
  global_rotary_fraction: 0.25
  global_num_key_value_heads: 2
  global_head_dim: 64
  global_key_equals_value: true
  attention_dropout: 0.0
optimizer:
  _target_: torch.optim.AdamW
  lr: 0.0006
loss:
  _target_: models.gemma4_dense.CausalLMCrossEntropyLoss
  ignore_index: -100
data:
  dataset:
    _target_: dataset_impl.python_edu.load_function_dataset
    path: Avelina/python-edu-cleaned
    dataset_size: null
    split: train
    max_length: 512
    require_docstring: false
  transform:
    _target_: dataset_impl.python_edu.PythonEduTransform
    max_length: 512
  dataloader:
    batch_size: 64
    shuffle: true
    num_workers: 8
  test_ratio: 0.1
  val_ratio: 0.1
trainer:
  epochs: 4
  precision: bf16
  log_every_steps: 50
  early_stopping_patience: 2
  inference_every_epochs: null
  inference_num_samples: 2
  max_inference_new_tokens: 16
  benchmark_every_epochs: 1
  benchmark_num_samples: 2
  max_benchmark_new_tokens: 128
  humaneval_enabled: true
  humaneval_max_new_tokens: 192
  humaneval_batch_size: 16
  humaneval_strip_docstrings: true
  grad_clip_norm: 1.0
output:
  root: outputs
  run_name: gemma4_dense__py_edu_15m
logger: tensorboard
seed: 42
device: null
