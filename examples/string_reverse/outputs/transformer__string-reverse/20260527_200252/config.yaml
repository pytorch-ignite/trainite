model:
  _target_: models.transformer.build_transformer_model
  hidden_size: 4
  num_layers: 2
  num_heads: 2
  feedforward_dim: 8
  dropout: 0.1
  max_seq_len: 128
optimizer:
  _target_: torch.optim.AdamW
  lr: 0.001
data:
  train:
    dataset:
      _target_: dataset.string_reverse.build_string_reverse_dataset
      size: 25
      charset: null
      min_seq_len: 1
      max_seq_len: 16
      seq_len: null
      seed: 7
    dataloader:
      batch_size: 32
      shuffle: true
      num_workers: 2
      collate_fn:
        _target_: dataset.string_reverse.collate_fn
  val: null
  test: null
trainer:
  log_every_steps: 10
  epochs: 3
  grad_clip_norm: null
output:
  root: outputs
  run_name: transformer__string-reverse
seed: 42
device: auto
