# Smallest arm of the size sweep: 15.4M total / 13.1M active.
#
# Purpose: locate the knee of the size curve. Everything tested so far spans
# 53.9M -> 228.2M active with no measurable HumanEval difference, so the curve is
# unmeasured below ~54M. This arm is also the size plain Chinchilla would pick for
# the corpus (13.1M active x 20 tok/param = 262M tokens = 0.87 passes), so if even
# this model stays competitive, the scaling question is closed.
#
#   params      15.4M total / 13.1M active  (27% of it is the 8192-token embedding)
#   corpus      docstring-optional, ~4.0M examples, ~0.31B train tokens/pass
#   epochs      4      -> ~1.25B tokens -> ~95 tok/param
#   unique/pass 313M / 13.1M = 23.9 tok/param, already compute-optimal at ~1 epoch
#
# 4 epochs is deliberately over compute-optimal: the run is data-loader bound, so
# the extra passes are cheap, and holding passes constant with the 156M arm keeps
# the comparison single-variable. The real limit is repetition value, not tok/param.
#
# batch 16, not 24. At a fixed epoch count the token budget -- and therefore total
# FLOPs -- is identical for any batch size, so a larger batch saves no compute; it
# only buys fewer optimizer steps. This run is data-loader bound (~37 min/pass of
# tokenization vs ~27 min of GPU work), so batch 16 costs zero wall clock and
# yields 1.5x the updates. It also matches the batch-16 recipe of the earlier
# 53.9M -> 228.2M size sweep.
#
# Expected cost: ~46 min/epoch, ~3h total. The tokenizer runs at ~1,450
# examples/s, which is the floor here -- the model is far too fast to stay
# compute-bound, so do not expect a 10x speedup over the 156M run.
#
# Read against the 156M relaxed run (31/164 base, 25/164 plus):
#   >= 25/164  capacity is nearly irrelevant -> stop scaling, fix corpus quality
#   18- 24/164 knee is below 156M           -> 270M unlikely to pay off
#   10- 17/164 capacity matters             -> scale up
#   <  10/164  13M cannot write usable code -> curve is steep, scale up
project_name: py-edu-gemma-moe
preprocessor:
  _target_: preprocessors.python_bpe.load_python_bpe_tokenizer
  vocab_size: 8192
  cache_dir: outputs/tokenizers
model:
  _target_: models.gemma4_moe.Gemma4MoEModel
  collate_fn_target: models.gemma4_moe.CausalLMCollateFn
  hidden_size: 256
  num_layers: 8
  num_attention_heads: 4
  num_key_value_heads: 2
  dense_intermediate_size: 768
  expert_dim: 384
  num_experts: 3
  top_k: 2
  head_dim: 64
  layer_types: null
  layer_pattern: sssg
  sliding_window: 512
  rope_theta: 10000.0
  global_rope_theta: 1000000.0
  rotary_fraction: 1.0
  global_rotary_fraction: 0.25
  global_num_key_value_heads: 2
  global_head_dim: 64
  global_key_equals_value: true
  attention_dropout: 0.0
optimizer:
  _target_: torch.optim.AdamW
  lr: 0.0006
loss:
  _target_: models.gemma4_moe.GemmaMoECausalLMLoss
  ignore_index: -100
  aux_loss_coef: 0.01
data:
  dataset:
    _target_: dataset_impl.python_edu.load_function_dataset
    path: Avelina/python-edu-cleaned
    dataset_size: null
    split: train
    max_length: 512
    require_docstring: false # Same cache entry as config.relaxed.yaml.
  transform:
    _target_: dataset_impl.python_edu.PythonEduTransform
    max_length: 512
  dataloader:
    batch_size: 16 # Dataloader-bound run, so 16 costs the same wall clock as 24 and gives 1.5x the updates.
    shuffle: true
    num_workers: 8
  test_ratio: 0.1
  val_ratio: 0.1
trainer:
  epochs: 4
  precision: bf16
  log_every_steps: 50
  early_stopping_patience: 2
  inference_every_epochs: null
  inference_num_samples: 2
  max_inference_new_tokens: 16
  benchmark_every_epochs: 1
  benchmark_num_samples: 2
  max_benchmark_new_tokens: 128
  humaneval_enabled: true
  humaneval_max_new_tokens: 192
  humaneval_batch_size: 16
  humaneval_strip_docstrings: true # Same diagnostic as the other relaxed runs.
  grad_clip_norm: 1.0
output:
  root: outputs
  run_name: gemma4_moe__relaxed_15m
logger: tensorboard
seed: 42
device: null
