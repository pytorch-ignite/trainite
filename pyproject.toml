[project]
name = "trainite-prototype"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2",
    "PyYAML",
    "omegaconf>=2.3.0",
    "tomlkit>=0.15.0",
    "packaging>=26.2",
]


[project.scripts]
trainite = "trainite.cli:main"

[tool.uv]
package = true

[tool.pyrefly]

project-excludes = [
    "**/venv/**",
    "**/.venv/**",
    "**/build/**",
    "**/docs/**",
    "**/examples/**",
]

preset = "basic"
output-format = "full-text"

[dependency-groups]
generated = [
    "pydantic>=2",
    "PyYAML",
    "omegaconf>=2.3.0",
    "torch",
    "pytorch-ignite",
    "tensorboard",
]
dev = [
    "torch",
    "pytorch-ignite",
    "tensorboard",
    "pytest>=9.0.3",
    "pre-commit>=4.6.0",
    "pyrefly>=1.0.0",
]
