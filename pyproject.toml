[build-system]
requires = ["hatchling>=1.24.2"]
build-backend = "hatchling.build"

[project]
name = "trainite"
authors = [
    {name = "PyTorch-Ignite Team", email = "contact@pytorch-ignite.ai"},
]
description = "Model training toolkit with PyTorch-Ignite."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2",
    "PyYAML",
    "omegaconf>=2.3.0",
    "tomlkit>=0.15.0",
    "packaging>=26.2",
    "questionary>=2.1.1",
    "tyro>=1.0.0",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://pytorch-ignite.ai"
Repository = "https://github.com/pytorch-ignite/trainite"

[project.scripts]
trainite = "trainite.cli:main"

[tool.hatch.version]
path = "trainite/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["trainite"]
only-include = ["trainite"]
artifacts = [
  "*.typed",
]

[tool.hatch.build.targets.wheel.force-include]
"pyproject.toml" = "trainite/pyproject.toml"

[tool.uv]
package = true
default-groups = []

[tool.pyrefly]
project-excludes = [
    "**/venv/**",
    "**/.venv/**",
    "**/build/**",
    "**/docs/**",
    "**/examples/**",
]
preset = "basic"
output-format = "full-text"

[dependency-groups]
generated = [
    "pydantic>=2",
    "PyYAML",
    "omegaconf>=2.3.0",
    "torch",
    "pytorch-ignite",
    "tensorboard",
    "clearml",
]
dev = [
    "datasets>=4",
    "transformers",
    "torch",
    "pytorch-ignite",
    "tensorboard",
    "pytest>=9.0.3",
    "pre-commit>=4.6.0",
    "pyrefly>=1.0.0",
    "clearml",
]
integrations = [
    "skypilot",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material",
]
[tool.ruff]
src = ["trainite", "examples", "tests"]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "assets",
]
line-length = 120
indent-width = 4
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402", "E713", "E721", "E722", "E203", "E231", "F403", "F841"]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.isort]
known-third-party = ["clearml", "dill", "matplotlib", "numpy", "pkg_resources", "pytest", "requests", "setuptools", "skimage", "sklearn", "torch", "torchvision"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", ]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
docstring-code-line-length = "dynamic"

[tool.black]
line-length = 120
target-version = ['py311', 'py313']
include = '\.pyi?$'
exclude = '''
(
  /(
      \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | assets
  )/
  | foo.py
)
'''
[tool.pytest.ini_options]
addopts = "--color=yes -m 'not integration'"
markers = [
    "integration: slow tests that build an isolated uv env and train a real step",
]
